# Base profile for ANY purchase order.
#
# Both sample POs (BrightOps, NovaFleet) are handled ENTIRELY by this file —
# neither needs a customer override. That is the intended shape: a customer file
# exists only where a document departs from the norm.
#
# No field declares "use the LLM". Each tries its deterministic rule and
# escalates only if that yields nothing or fails to parse. POs state everything
# plainly, so in practice nothing escalates here.
doc_type: purchase_order

fields:
  start_date:
    labels: ["Contract Start Date", "Start Date", "Subscription Start Date"]
    input_format: dash_mdy
  end_date:
    labels: ["Contract End Date", "End Date", "Subscription End Date"]
    input_format: dash_mdy
  amount:
    labels: ["Total PO Amount", "Total Amount", "Total"]
    money_format: code_suffix          # "$162,000 USD"
  payment_terms:
    labels: ["Payment Terms"]
    sections: ["Payment Terms", "Order Summary"]   # sent only if it escalates
  billing_frequency:
    labels: ["Billing Frequency"]

# A PO names both parties under explicit headings, which is also a strong
# classification signal — order forms never label them this way.
parties:
  buyer:
    name:    { labels: ["Company Name", "Buyer Name", "Customer Name"] }
    address: { labels: ["Billing Address"], strategy: multiline_after_label, max_lines: 4 }
    signature_present: { labels: ["Buyer Signature"], strategy: signature_marker }
    signer_name:    { labels: ["Name"] }
    signer_title:   { labels: ["Title"] }
    signature_date: { labels: ["Date"], input_format: dash_mdy }
  vendor:
    name:    { labels: ["Vendor Name", "Supplier Name"] }
    address: { labels: ["Vendor Address"], strategy: multiline_after_label, max_lines: 4 }

type_fields:
  po_number: { labels: ["Purchase Order Number", "PO Number"] }
  po_date:   { labels: ["PO Date"], input_format: dash_mdy }

items:
  column_synonyms:
    product_name: ["Product Name", "Name", "Description", "Item"]
    item_start_date: ["Start Date"]
    item_end_date: ["End Date"]
    unit_price: ["Unit Price", "Rate", "Price"]
    quantity: ["Quantity", "Qty"]
    total_amount: ["Total Amount", "Total", "Amount"]
  date_format: dash_mdy
  reconcile: quantity * unit_price
  tolerance: 0.01

special_terms:
  section: "Special Terms"
  # POs LABEL their terms, so labelled_bullets parses them and nothing escalates.
  type_labels:
    burst: ["Burst (Item Level)", "Burst"]
    technical_account_manager: ["Technical Account Manager"]
  unknown_type: unknown
